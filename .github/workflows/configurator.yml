name: Configurator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        working-directory: configurator
        run: pip install "PySide6>=6.5" pyinstaller

      - name: Build standalone binary
        working-directory: configurator
        run: pyinstaller packaging/keybchord-configurator.spec

      - name: Rename binary per OS
        working-directory: configurator
        shell: bash
        run: |
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          os_name=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          mv "dist/keybchord-configurator${ext}" "dist/keybchord-configurator-${os_name}${ext}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keybchord-configurator-${{ matrix.os }}
          path: configurator/dist/keybchord-configurator*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: configurator/dist/keybchord-configurator*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
