name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e pico
        working-directory: keybchord

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: keybchord/.pio/build/pico/firmware.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
