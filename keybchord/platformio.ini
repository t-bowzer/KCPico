[platformio]
default_envs = pico

[env]
extra_scripts = pre:scripts/git_version.py

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags =
  -std=gnu++17
  -DUSE_TINYUSB
  -DPIO_USB_DP_PIN_DEFAULT=0
  -DKEYBCHORD_LOG
lib_deps =
  sekigon-gonnoc/Pico PIO USB
  bblanchon/ArduinoJson
monitor_speed = 115200

; On-device build with the gated CDC test-command hook (M11 hardware test).
; Excluded from the production `pico` build.
[env:testhook]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags =
  -std=gnu++17
  -DUSE_TINYUSB
  -DPIO_USB_DP_PIN_DEFAULT=0
  -DKEYBCHORD_LOG
  -DKEYBCHORD_TEST_HOOK
lib_deps =
  sekigon-gonnoc/Pico PIO USB
  bblanchon/ArduinoJson
monitor_speed = 115200

; CH559 USB-host coprocessor build (M12): keyboard input over the CH559 UART
; bridge (InputCh559) instead of the PIO-USB host. Drops the Pico PIO USB
; dependency and the PIO_USB_DP_PIN_DEFAULT flag.
[env:pico-ch559]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags =
  -std=gnu++17
  -DUSE_TINYUSB
  -DKEYBCHORD_LOG
  -DKEYBCHORD_CH559
lib_deps =
  bblanchon/ArduinoJson
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=gnu++17 -DKEYBCHORD_NATIVE
lib_deps =
  google/googletest
  bblanchon/ArduinoJson
lib_extra_dirs =
  lib/core
  lib/hw
  lib/engines
build_src_filter =
  +<../lib/core/>
  +<../lib/hw/*_null.*>
  +<../lib/hw/*_stub.*>
  +<../lib/hw/base.h>
  +<../lib/hw/factory.*>
  +<../lib/engines/midi_router.*>
  +<../lib/engines/chord_engine.*>
  +<../lib/engines/strum_engine.*>
  +<../lib/engines/rhythm_engine.*>
  +<../lib/engines/display_manager.*>
  +<../lib/engines/edit_engine.*>
  +<../lib/engines/preset_engine.*>
  +<../lib/core/rhythm.*>
  +<../test/>
  -<*>
test_framework = googletest
