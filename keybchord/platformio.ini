[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags =
  -std=gnu++17
  -DUSE_TINYUSB
  -DPIO_USB_DP_PIN_DEFAULT=0
lib_deps =
  sekigon-gonnoc/Pico PIO USB
  bblanchon/ArduinoJson
  duinowitchery/hd44780
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=gnu++17 -DKEYBCHORD_NATIVE
lib_deps =
  google/googletest
  bblanchon/ArduinoJson
lib_extra_dirs =
  lib/core
  lib/hw
  lib/engines
build_src_filter =
  +<../lib/core/>
  +<../lib/hw/*_null.*>
  +<../lib/hw/*_stub.*>
  +<../lib/hw/base.h>
  +<../lib/hw/factory.*>
  +<../lib/engines/midi_router.*>
  +<../lib/engines/chord_engine.*>
  +<../lib/engines/strum_engine.*>
  +<../lib/engines/rhythm_engine.*>
  +<../lib/core/rhythm.*>
  +<../test/>
  -<*>
test_framework = googletest
